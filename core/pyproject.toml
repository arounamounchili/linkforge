[project]
name = "linkforge-core"
version = "1.2.0"
description = "Universal Robotics Interoperability Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xacrodoc>=1.3",
    "rospkg>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
