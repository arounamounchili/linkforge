[project]
name = "linkforge-blender"
version = "1.4.4" # x-release-please-version
description = "LinkForge Blender: Visual Designer for the Programmable Robot Description Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "linkforge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkforge"]

[tool.uv.sources]
linkforge-core = { workspace = true }
