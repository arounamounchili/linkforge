name: External Link Check

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Link Checker (lychee)
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose --no-progress --max-retries 3
            --exclude ".*\.local"
            --exclude "https://hynek.me/.*"
            --exclude "https://www.mec.ed.tum.de/en/iwb/.*"
            --exclude "https://cmp.felk.cvut.cz/~peckama2/"
            --exclude "https://www.gnu.org/licenses/gpl-3.0"
            --exclude "https://monorepo.tools/"
            --exclude "https://www.conventionalcommits.org/"
            --exclude "https://github.com/[^/]+$"
            --exclude "https://github.com/.*/commits.*"
            --exclude "https://allcontributors.org/docs/en/emoji-key"
            --exclude-path "docs/source/.*[a-z0-9]$"
            README.md docs/
          fail: true
