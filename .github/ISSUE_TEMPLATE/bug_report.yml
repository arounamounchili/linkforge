name: "🐞 Bug Report"
description: "Tell us about a bug you found in LinkForge"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for taking the time to report a bug!**

        Please fill out the form below to help us investigate. If you have any questions, feel free to ask in our [Discussions](https://github.com/arounapatouossamounchili/linkforge/discussions).
  - type: input
    id: linkforge_version
    attributes:
      label: "LinkForge Version"
      placeholder: "e.g. 1.5.5, main, or git commit"
    validations:
      required: true
  - type: input
    id: blender_version
    attributes:
      label: "Blender Version (if applicable)"
      description: "Leave blank if this bug is in the core library and unrelated to Blender."
      placeholder: "e.g. 4.2 LTS, 5.2"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "A clear and concise description of the bug or unexpected behavior."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open Blender
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / Screenshots / Error Tracebacks"
      description: "Please attach any relevant screenshots or logs from the Blender console (Window > Toggle System Console) or terminal."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: I searched existing issues before creating this report.
          required: true
        - label: I am using the latest release or main branch of LinkForge.
          required: false
